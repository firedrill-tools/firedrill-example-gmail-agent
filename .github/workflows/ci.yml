name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  example:
    name: Check example agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check agent and web application
        run: npm run check

      - name: Check managed CI client
        run: npx firedrill ci --help

  managed-drill:
    name: Run Gmail agent against Firedrill
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify checked-out revision
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          echo "CI_REVISION=$EXPECTED_REVISION" >> "$GITHUB_ENV"

      - name: Run revision-bound Gmail agent check
        env:
          PROJECT_ID: ${{ vars.FIREDRILL_PROJECT_ID }}
          ENVIRONMENT_ID: ${{ vars.FIREDRILL_ENVIRONMENT_ID }}
          REPOSITORY_BINDING_ID: ${{ vars.FIREDRILL_REPOSITORY_BINDING_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$PROJECT_ID"
          test -n "$ENVIRONMENT_ID"
          test -n "$REPOSITORY_BINDING_ID"
          test -n "$ANTHROPIC_API_KEY"
          npx firedrill ci run --auth github \
            --project "$PROJECT_ID" \
            --environment "$ENVIRONMENT_ID" \
            --repository-binding "$REPOSITORY_BINDING_ID" \
            --revision "$CI_REVISION" \
            --root . --suite default \
            --agent-command node \
            --agent-arguments '["--import","tsx","test/run-agent.mjs"]' \
            --capture-logs retain-on-failure \
            --json
