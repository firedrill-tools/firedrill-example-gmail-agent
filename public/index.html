<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gmail Agent</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">✉</span>
        <span class="brand-name">Gmail Agent</span>
      </div>
      <button id="new-conversation" class="btn btn-primary">New conversation</button>
      <nav id="conversation-list" class="conversation-list" aria-label="Conversations"></nav>
      <div class="sidebar-foot">
        <div id="status" class="status">
          <span class="dot"></span><span class="status-text">connecting…</span>
        </div>
      </div>
    </aside>

    <main class="chat">
      <header class="chat-header">
        <h1 id="chat-title">Start a conversation</h1>
        <div id="chat-meta" class="chat-meta"></div>
        <div id="gmail-bar" class="gmail-bar">
          <span class="gmail-dot"></span>
          <span id="gmail-summary">checking Gmail…</span>
        </div>
      </header>
      <section id="messages" class="messages" aria-live="polite"></section>
      <form id="composer" class="composer" autocomplete="off">
        <textarea id="input" rows="1" placeholder="Ask about your inbox, or tell me what to do — e.g. “Summarise unread mail from today”, “Label everything from Stripe as Billing”, “Reply to Ana confirming Thursday”." required></textarea>
        <button id="send" class="btn btn-primary" type="submit">Send</button>
      </form>
    </main>

    <aside class="actions-panel">
      <header class="panel-header">
        <h2>Actions taken</h2>
        <span id="actions-count" class="pill">0</span>
      </header>
      <p class="panel-hint">Every Gmail tool call the agent makes, across all conversations, from the local database.</p>
      <ol id="actions-list" class="actions-list"></ol>
    </aside>
  </div>

  <template id="tpl-approval">
    <div class="approval">
      <div class="approval-title">The agent wants to <strong class="approval-tool"></strong></div>
      <pre class="approval-input"></pre>
      <div class="approval-buttons">
        <button class="btn btn-danger" data-decision="deny">Deny</button>
        <button class="btn btn-primary" data-decision="allow">Allow</button>
      </div>
    </div>
  </template>

  <script src="/app.js" type="module"></script>
</body>
</html>
